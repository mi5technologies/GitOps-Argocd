# BLUE frontend deployment - the version currently receiving traffic.
# Blue-green: the Service (service.yaml) selects "version: blue" OR "version: green".
# Switching traffic is one command - see "Blue-Green Deployment" in the README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-blue
  namespace: cloudradar
  labels:
    app: frontend
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: blue
  template:
    metadata:
      labels:
        app: frontend
        version: blue
    spec:
      containers:
        - name: frontend
          # Replace your-dockerhub-username with your Docker Hub username (see README step 2)
          image: your-dockerhub-username/cloudradar-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

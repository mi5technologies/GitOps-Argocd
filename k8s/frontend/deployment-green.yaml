# GREEN frontend deployment - the "next version" slot.
# Deploy a new image tag here, test it, then switch the Service selector to green.
# Identical to blue except for the version label (and the image tag when you upgrade).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
  namespace: cloudradar
  labels:
    app: frontend
    version: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: green
  template:
    metadata:
      labels:
        app: frontend
        version: green
    spec:
      containers:
        - name: frontend
          # Change this tag (e.g. :v2) when rolling out a new version via green
          image: your-dockerhub-username/cloudradar-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

# PostgreSQL datastore as a StatefulSet.
# A StatefulSet gives the pod a stable name (postgres-0) and a persistent volume
# that survives pod restarts (see volumeClaimTemplates at the bottom).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cloudradar
  labels:
    app: postgres
spec:
  serviceName: postgres          # must match the headless Service name
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          # Username / password / db name come from the Secret
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            # Store data in a subdirectory so the volume mount works cleanly
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Is the database process alive?
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudradar"]
            initialDelaySeconds: 15
            periodSeconds: 10
          # Is the database ready to accept connections?
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudradar"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # Kubernetes creates a PersistentVolumeClaim per replica automatically
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

# Database credentials. The backend reads these too, so user/password live in ONE place.
# NOTE: for a real production system use a secret manager (Sealed Secrets, External Secrets, AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: cloudradar
type: Opaque
stringData:
  POSTGRES_USER: cloudradar
  POSTGRES_PASSWORD: cloudradar123
  POSTGRES_DB: cloudradar

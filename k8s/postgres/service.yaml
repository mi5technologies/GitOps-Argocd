# Headless Service (clusterIP: None) - the standard way to expose a StatefulSet.
# Other pods reach the database at:  postgres.cloudradar.svc.cluster.local:5432  (or just "postgres")
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloudradar
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

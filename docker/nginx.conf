# nginx config for the CloudRadar frontend.
# - Serves the built Vue single-page app
# - Proxies every /api request to the backend Service (DNS name "backend" inside the cluster)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue SPA: always fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go to the backend Service on port 8000
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Needed for the live scan progress stream (Server-Sent Events)
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
    }
}
